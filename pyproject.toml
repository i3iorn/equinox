[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equinox"
version = "0.1.0"
description = "A local-first API testing tool with GUI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Equinox Team"}
]
keywords = ["api", "testing", "http", "rest", "postman", "gui"]
dependencies = [
    "httpx>=0.24.0",
    "PyQt6>=6.5.0",
    "pygments>=2.15.0",
    "jsonschema>=4.0.0",
    "jsonpath-ng>=1.6.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "certifi>=2023.0.0",
    "urlps>=0.3.5",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "pre-commit>=3.0.0",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=equinox --cov-report=html --cov-report=term"
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "src/equinox/plugins/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.setuptools.package-data]
equinox = ["py.typed"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
