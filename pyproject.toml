[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equinox"
dynamic = ["version"]
description = "A local-first API testing tool with GUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Equinox Team"}
]
keywords = ["api", "testing", "http", "rest", "postman", "gui"]
dependencies = [
    "httpx>=0.24.0,<1.0.0",
    "click>=8.0.0,<9.0.0",
    "PyQt6>=6.5.0,<7.0.0",
    "pygments>=2.15.0,<4.0.0",
    "jsonschema>=4.0.0,<5.0.0",
    "jsonpath-ng>=1.6.0,<1.7.0",
    "pyyaml>=6.0.0,<7.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "cryptography>=50.0,<51.0",
    "certifi>=2023.0.0",
    "urlps==0.5.1",
    "websockets>=12.0,<13.0.0",
    "typing_extensions>=4.0.0,<5.0.0",
]

[project.scripts]
equinox = "equinox.cli.main:main_entry"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-qt>=4.2.0",
    "hypothesis>=6.120.0",
    "pytest-benchmark>=4.0.0",
    "pytest-mock>=3.12.0",
    "black>=23.0.0",
    "ruff>=0.5.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "types-jsonschema>=4.0.0",
    "types-requests>=2.0.0",
    "bandit>=1.7.0",
    "pip-audit>=2.9.0",
    "pip-tools>=7.5.0,<8.0.0",
    "pre-commit>=3.0.0",
    "isort>=5.13.0,<6.0.0",
]

[tool.setuptools.dynamic]
version = { attr = "equinox.__version__" }

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
]
ignore = [
    "E501",  # Line too long (handled by line-length)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["equinox"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "F841", "E741", "E722"]
"scripts/benchmark_history_search.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=equinox --cov-report=html --cov-report=term"
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "src/equinox/plugins/*",
    "src/equinox/gui/*",
    "tests/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "except ImportError:",
]
precision = 1
skip_covered = true
skip_empty = true
show_missing = true
fail_under = 87

[tool.setuptools.package-data]
equinox = ["py.typed"]

[tool.mypy]
python_version = "3.10"
# CI (ubuntu-latest) is the authoritative target. Without this, mypy
# evaluates sys.platform-conditional typeshed stubs (e.g. the Unix-only
# `resource` module) against whatever OS is actually running mypy, so a
# Windows-run check and CI's Linux-run check can disagree on the exact same
# source tree - notably on "unused type: ignore" for guards around
# platform-conditional imports.
platform = "linux"
# CI runs `mypy --strict src` (ci.yml); CONTRIBUTING.md/WORKFLOW.md document
# the bare `mypy src` command for local use. Without `strict = true` here,
# those two only agreed on the settings explicitly listed below, and the
# local command was measurably weaker than CI's gate (70 vs 93 errors found
# on the same tree at one point). Declaring it here makes both commands
# identical, so "passes locally" actually means "passes in CI".
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["defusedxml.*", "jsonpath_ng.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_any_generics = true
disallow_subclassing_any = true
warn_unused_ignores = true
no_implicit_reexport = true
