[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equinox"
version = "0.4.7"
description = "A local-first API testing tool with GUI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Equinox Team"}
]
keywords = ["api", "testing", "http", "rest", "postman", "gui"]
dependencies = [
    "httpx>=0.24.0,<1.0.0",
    "click>=8.0.0,<9.0.0",
    "PyQt6>=6.5.0,<7.0.0",
    "pygments>=2.15.0,<4.0.0",
    "jsonschema>=4.0.0,<5.0.0",
    "jsonpath-ng>=1.6.0,<1.7.0",
    "pyyaml>=6.0.0,<7.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "cryptography>=41.0.0,<43.0.0",
    "certifi>=2023.0.0",
    "urlps>=0.3.5,<0.4.0",
    "websockets>=12.0,<13.0.0",
]

[project.scripts]
equinox = "equinox.cli.main:main_entry"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.120.0",
    "pytest-benchmark>=4.0.0",
    "pytest-mock>=3.12.0",
    "black>=23.0.0",
    "ruff>=0.5.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "pip-tools>=7.5.0,<8.0.0",
    "pre-commit>=3.0.0",
    "isort>=5.13.0,<6.0.0",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import sorting)
]
ignore = [
    "E501",  # Line too long (handled by line-length)
]

[tool.ruff.lint.isort]
known-first-party = ["equinox"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "F841", "E741", "E722"]
"scripts/benchmark_history_search.py" = ["E402"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=equinox --cov-report=html --cov-report=term"
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "src/equinox/plugins/*",
    "src/equinox/gui/*",
    "tests/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "except ImportError:",
]
precision = 1
skip_covered = true
skip_empty = true
show_missing = true
fail_under = 80

[tool.setuptools.package-data]
equinox = ["py.typed"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_any_generics = true
disallow_subclassing_any = true
warn_unused_ignores = true
no_implicit_reexport = true
