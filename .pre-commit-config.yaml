repos:
  - repo: local
    hooks:
      - id: dependency-manifest-consistency
        name: dependency-manifest-consistency
        entry: python scripts/check_dependency_consistency.py
        language: python
        pass_filenames: false
        files: ^(pyproject\.toml|setup\.py|requirements\.txt)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://github.com/psf/black
    rev: 24.4.0
    hooks:
      - id: black
        language_version: python3.9

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        additional_dependencies: ["types-PyYAML", "types-requests"]
        args: [--strict, src, tests]
        exclude: ^(tests/|examples/)

  - repo: https://github.com/bandit-org/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-r, src/equinox, --severity-level=medium]
        exclude: ^tests/
