repos:
- repo: https://github.com/psf/black
  rev: 23.12.0
  hooks:
  - id: black
    language_version: python3
- repo: https://github.com/PyCQA/isort
  rev: 5.13.0
  hooks:
  - id: isort
- repo: https://github.com/astral-sh/ruff
  rev: v0.6.0
  hooks:
  - id: ruff
    args: ["--fix", "--select", "E,F,W"]
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v0.971
  hooks:
  - id: mypy
