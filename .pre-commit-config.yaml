repos:
  # ── Local project-specific checks ──────────────────────────────────────────
  - repo: local
    hooks:
      - id: code-component-size
        name: "Check: code component sizes are within limits"
        entry: python scripts/check_code_component_size.py
        language: python
        pass_filenames: false
        files: ^(src/equinox/.*\.py)$

      - id: dependency-manifest-consistency
        name: "Check: dependency manifest consistency"
        entry: python scripts/check_dependency_consistency.py
        language: python
        pass_filenames: false
        files: ^(pyproject\.toml|setup\.py|requirements\.txt|requirements-lock\.txt)$

      - id: requirements-lock-current
        name: "Check: requirements lockfile is current"
        entry: python scripts/manage_requirements_lock.py --check
        language: python
        additional_dependencies: [pip-tools]
        pass_filenames: false
        files: ^(pyproject\.toml|requirements\.txt|requirements-lock\.txt)$

      - id: verify-ci-toolchain
        name: "Check: CI toolchain matches declared dependencies"
        entry: python scripts/verify_ci_toolchain.py
        language: python
        pass_filenames: false
        stages: [pre-commit]
        files: ^(\.github/workflows/.*\.yml|pyproject\.toml)$

      - id: run-affected-tests
        name: "Check: run affected tests with coverage (may take several minutes)"
        entry: python scripts/run_affected_tests.py
        language: system
        pass_filenames: true
        stages: [pre-commit]
        files: ^(src/equinox/.*\.py|tests/.*\.py|pyproject\.toml)$

      - id: mypy-strict
        name: "Check: mypy strict (CI-aligned)"
        entry: python -m mypy --strict src
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(src/equinox/.*\.py|tests/.*\.py|pyproject\.toml)$

  # ── General file hygiene ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key
 #     - id: no-commit-to-branch
 #       args: ['--branch', 'main', '--branch', 'master']

  # ── Python formatting & linting (ruff replaces black + isort) ──────────────
  # ruff-format is the drop-in Black replacement; ruff check handles isort (I rule).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format


  # ── Security scanning ───────────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: [-r, src/equinox, --severity-level=medium, -q, -s, "B102,B113,B318,B608"]
        pass_filenames: false
        exclude: ^tests/
