fail_fast: true
default_stages: [pre-commit, pre-push]
# default_language_version:
#  python: python3.11

repos:
  # ── Local project-specific checks ──────────────────────────────────────────
  - repo: local
    hooks:
      - id: code-component-size
        name: "Check: code component sizes are within limits"
        entry: python scripts/check_code_component_size.py
        language: python
        pass_filenames: true
        files: ^(src/equinox/.*\.py)$

      - id: dependency-manifest-consistency
        name: "Check: dependency manifest consistency"
        entry: python scripts/check_dependency_consistency.py
        language: python
        pass_filenames: false
        files: ^(pyproject\.toml|setup\.py)$

      - id: verify-ci-toolchain
        name: "Check: CI toolchain matches declared dependencies"
        entry: python scripts/verify_ci_toolchain.py
        language: python
        pass_filenames: false
        stages: [pre-commit]
        files: ^(\.github/workflows/.*\.yml|pyproject\.toml)$

      - id: run-affected-tests
        name: "Check: run affected tests with coverage (may take several minutes)"
        entry: python scripts/run_affected_tests.py
        language: system
        pass_filenames: true
        stages: [pre-push]
        files: ^(src/equinox/.*\.py|tests/.*\.py|pyproject\.toml)$
        exclude: ^(docs/|README\.md)

      - id: mypy-strict
        name: "Check: mypy strict (CI-aligned)"
        # --strict now comes from pyproject.toml's [tool.mypy] (strict = true),
        # not this flag, so both this hook and `mypy src` agree by construction.
        # --follow-imports=silent/--ignore-missing-imports stay: this hook runs
        # per-staged-file, and without them a single-file check would cascade
        # strict analysis into every transitively imported module instead of
        # scoping to what's actually being committed.
        entry: python -m mypy --follow-imports=silent --ignore-missing-imports
        language: system
        pass_filenames: true
        stages: [pre-commit]
        files: ^(src/equinox/.*\.py)$
        exclude: ^(tests/|docs/|README\.md)

  # ── General file hygiene ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-ast
      - id: debug-statements
      - id: check-symlinks
      - id: mixed-line-ending
      - id: detect-private-key
      - id: no-commit-to-branch
        # master is release-only: it changes solely via the dev -> master
        # promotion PR. Direct local commits while checked out on master
        # are almost always a mistake — this catches it before push.
        args: ['--branch', 'master']

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: fix-byte-order-marker

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        # Must match pyproject.toml's requires-python floor (>=3.10), not a
        # higher one - pyupgrade will happily emit syntax that's only valid
        # on the newer target, silently breaking the older versions CI still
        # tests (see the log_setup.py fix this comment accompanies).
        args: ["--py310-plus"]

  - repo: https://github.com/asottile/yesqa
    rev: v1.5.0
    hooks:
      - id: yesqa

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix, --exit-zero]
      - id: ruff-format
        # Keeps this hook's ruff pinned to the same version CI resolves
        # (pyproject.toml's `ruff>=0.5.0` is unbounded, so CI always installs
        # latest). Without a matching local check, format drift accumulates
        # silently until `ruff format --check` fails in CI — see the 140-file
        # backlog this rev bump fixed.

  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma

  # ── Security scanning ───────────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [ "--baseline", ".secrets.baseline" ]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: "Bandit (changed files, fast)"
        args: [--severity-level=medium, -q, -s, "B102,B113,B318,B608"]
        stages: [pre-commit]
        files: ^src/equinox/.*\.py$
        exclude: ^tests/

      - id: bandit
        name: "Bandit (full scan, pre-push)"
        args: [-r, src/equinox, --severity-level=medium, -q, -s, "B102,B113,B318,B608"]
        pass_filenames: false
        stages: [pre-push]
        exclude: ^tests/
