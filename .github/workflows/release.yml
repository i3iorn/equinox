name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # e.g. v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-rc*"    # e.g. v1.2.3-rc1

permissions:
  contents: write   # Needed to create GitHub Releases

env:
  PYTHON_DEFAULT: "3.11"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Build distributable artifacts (sdist + wheel)
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Required so setuptools-scm can infer the version

      - name: Set up Python ${{ env.PYTHON_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package integrity
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Run the full test suite against the built wheel
  # ──────────────────────────────────────────────────────────────────────────
  test-release:
    name: Smoke-test Release Wheel
    runs-on: ubuntu-latest
    needs: build
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxcb-cursor0 libegl1 libgl1 libglib2.0-0

      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Install from wheel + dev extras
        run: |
          python -m pip install --upgrade pip
          # Install the wheel itself, then dev extras from pyproject.toml
          pip install dist/*.whl
          pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest -q --no-cov

  # ──────────────────────────────────────────────────────────────────────────
  # Publish to PyPI and create a GitHub Release
  # ──────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI & GitHub
    runs-on: ubuntu-latest
    needs: test-release
    environment: release   # Requires "release" environment approval in repo settings
    steps:
      - uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Uses PYPI_API_TOKEN secret stored in the "release" environment.
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Extract changelog entry for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CHANGELOG_FILE="changelog/CHANGELOG_v${VERSION%.*.*}.${VERSION#*.*.}.md"
          # Fallback to any matching CHANGELOG file
          if [ ! -f "$CHANGELOG_FILE" ]; then
            CHANGELOG_FILE=$(ls changelog/CHANGELOG_v*.md 2>/dev/null | sort -V | tail -1)
          fi
          if [ -f "$CHANGELOG_FILE" ]; then
            echo "BODY<<EOF" >> "$GITHUB_OUTPUT"
            cat "$CHANGELOG_FILE" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "BODY=No changelog entry found for ${GITHUB_REF_NAME}." >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const isPreRelease = tag.includes('-rc') || tag.includes('-alpha') || tag.includes('-beta');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Equinox ${tag}`,
              body: process.env.RELEASE_BODY,
              prerelease: isPreRelease,
              generate_release_notes: false,
            });
        env:
          RELEASE_BODY: ${{ steps.changelog.outputs.BODY }}

