name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # e.g. v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-rc*"    # e.g. v1.2.3-rc1

permissions:
  contents: write   # Needed to create GitHub Releases

env:
  PYTHON_DEFAULT: "3.11"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Build distributable artifacts (sdist + wheel)
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Required so setuptools-scm can infer the version

      - name: Set up Python ${{ env.PYTHON_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package integrity
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Run the full test suite against the built wheel
  # ──────────────────────────────────────────────────────────────────────────
  test-release:
    name: Smoke-test Release Wheel
    runs-on: ubuntu-latest
    needs: build
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxcb-cursor0 libegl1 libgl1 libglib2.0-0

      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Install from wheel + dev extras
        run: |
          python -m pip install --upgrade pip
          # Install the wheel itself, then dev extras from pyproject.toml
          pip install dist/*.whl
          pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest -q --no-cov

  # ──────────────────────────────────────────────────────────────────────────
  # Create a GitHub Release carrying the built artifacts
  # ──────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: test-release
    # No `environment:` here. This previously referenced a "release"
    # environment that does not exist in this repo - GitHub silently
    # auto-creates a missing environment with no protection rules, so it
    # looked like an approval gate while providing none. If a real gate is
    # wanted, create the environment in repo settings with required
    # reviewers and re-add the key.
    steps:
      - uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      # NOTE: There is deliberately no PyPI publish step.
      # The distribution name `equinox` on PyPI belongs to an unrelated
      # project (Patrick Kidger's JAX neural-network library), so this
      # package cannot be published under that name. The step that used to
      # live here referenced a PYPI_API_TOKEN secret that was never
      # configured, so tagging produced a failed job - and because the
      # GitHub Release was created later in that same job, the release was
      # never created either. Publishing to PyPI requires first choosing an
      # unclaimed distribution name in pyproject.toml.

      - name: Extract changelog entry for this version
        id: changelog
        run: |
          # Strip the leading "v" and any pre-release suffix, so both
          # v0.5.0 and v0.5.0-rc1 resolve to CHANGELOG_v0.5.0.md.
          VERSION="${GITHUB_REF_NAME#v}"
          CHANGELOG_FILE="changelog/CHANGELOG_v${VERSION%%-*}.md"
          # Fallback to the newest changelog if this version has no entry.
          if [ ! -f "$CHANGELOG_FILE" ]; then
            CHANGELOG_FILE=$(ls changelog/CHANGELOG_v*.md 2>/dev/null | sort -V | tail -1)
          fi
          if [ -f "$CHANGELOG_FILE" ]; then
            echo "Using changelog: $CHANGELOG_FILE"
            echo "BODY<<CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
            cat "$CHANGELOG_FILE" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          else
            echo "BODY=No changelog entry found for ${GITHUB_REF_NAME}." >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: ${{ steps.changelog.outputs.BODY }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            *-rc*|*-alpha*|*-beta*) PRERELEASE="--prerelease" ;;
            *) PRERELEASE="" ;;
          esac
          printf '%s' "$RELEASE_BODY" > release-notes.md
          # Attach the built sdist/wheel so the release carries the
          # artifacts the build and smoke-test jobs already validated.
          gh release create "$TAG" \
            --title "Equinox $TAG" \
            --notes-file release-notes.md \
            $PRERELEASE \
            dist/*
