name: Security Scanning

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, master]
  schedule:
    # Run weekly on Mondays at 07:00 UTC to catch new CVEs
    - cron: "0 7 * * 1"

env:
  PYTHON_DEFAULT: "3.11"

jobs:
  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Required by the "Comment PR with security results" step below. Without
      # it the GITHUB_TOKEN gets a 403 ("Resource not accessible by
      # integration") when posting, which failed the whole security job even
      # though the scans themselves passed.
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Bandit - blocking (medium+ severity, JSON)
        # Skip list matches .pre-commit-config.yaml's bandit hooks and ci.yml -
        # see the comment there for why these four checks are excluded here.
        run: |
          bandit -r src/equinox --severity-level=medium -s "B102,B113,B318,B608" -f json -o bandit-report.json
          bandit -r src/equinox --severity-level=medium -s "B102,B113,B318,B608" -f txt

      - name: Dependency vulnerabilities - blocking
        run: python scripts/check_dependency_vulnerabilities.py

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

      - name: Comment PR with security results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## Security Scan Results\n\n';

            try {
              const report = JSON.parse(fs.readFileSync('bandit-report.json', 'utf8'));
              const m = report.metrics;
              const total = m ? m.total_issues ?? '?' : '?';
              const high   = m ? (m.high_severity   ?? m.SEVERITY_HIGH   ?? '?') : '?';
              const medium = m ? (m.medium_severity ?? m.SEVERITY_MEDIUM ?? '?') : '?';
              const low    = m ? (m.low_severity    ?? m.SEVERITY_LOW    ?? '?') : '?';

              comment += `### Bandit — Static Security Analysis\n`;
              comment += `| Severity | Count |\n|---|---|\n`;
              comment += `| High | ${high} |\n`;
              comment += `| Medium | ${medium} |\n`;
              comment += `| Low | ${low} |\n`;
              comment += `| **Total** | **${total}** |\n\n`;

              if (parseInt(high) > 0 || parseInt(medium) > 0) {
                comment += '> **High/Medium severity issues found — review required before merging.**\n\n';
              } else {
                comment += '> No high/medium severity issues found.\n\n';
              }
            } catch (e) {
              comment += '> Bandit report not available.\n\n';
            }

            comment += '_Full report available in the [workflow artifacts](' +
              `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})._`;

            // Posting the summary is a convenience, not the security verdict -
            // the blocking Bandit and dependency steps above already decided
            // that. Swallow failures here so a comment problem can never turn
            // a passing security scan red (or a failing one green).
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment,
              });
            } catch (e) {
              core.warning(`Could not post security summary comment: ${e.message}`);
            }
