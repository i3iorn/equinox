name: CI

on:
  push:
    branches: [dev]
  pull_request:
    # dev: every feature/fix/refactor PR into the integration branch.
    # master: the dev -> master release-promotion PR (master itself only
    # ever changes via that promotion, so it doesn't need its own push
    # trigger — the PR check already validates the merge commit).
    branches: [dev, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.11"
  # Required for PyQt6 to run headless on Linux CI runners
  QT_QPA_PLATFORM: offscreen
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

# ──────────────────────────────────────────────────────────────────────────────
# Job: lint
# Runs formatting, linting, and import-order checks on a single Python version.
# Fast-fail to give quick feedback before the heavier test matrix starts.
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install dev dependencies
        run: |
          # No pip ceiling here. It used to be capped below 26.2 because
          # pip-tools imports a symbol that release removed, but nothing in
          # this repo runs `pip-compile`/`pip-sync` any more -- the lockfile
          # tooling was dropped in v0.5.0 and only the unused dev dependency
          # survived. Meanwhile PYSEC-2026-3721 is fixed in exactly 26.2, so
          # the cap guaranteed the vulnerability gate below would fail.
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify dependency manifest consistency
        run: python scripts/check_dependency_consistency.py

      - name: Block known dependency vulnerabilities
        run: python scripts/check_dependency_vulnerabilities.py

      - name: Verify CI toolchain consistency
        run: python scripts/verify_ci_toolchain.py

      - name: Lint with Ruff (errors)
        run: ruff check src/ tests/

      - name: Format check with Ruff
        run: ruff format --check src/ tests/

  # ──────────────────────────────────────────────────────────────────────────
  # Job: typecheck
  # Strict mypy on src/. Runs on the default Python only.
  # ──────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type check with Mypy (strict)
        run: mypy src

  # ──────────────────────────────────────────────────────────────────────────
  # Job: test
  # Full test suite with coverage across the supported Python matrix.
  # Coverage is reported to Codecov from the default version only.
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]          # Don't spin up matrix jobs if linting failed
    strategy:
      fail-fast: false
      matrix:
        # Every stable release from requires-python (>=3.10) upward. 3.15 is
        # not out yet; add it here once setup-python serves a stable build.
        #
        # The binary dependencies all resolve on 3.13/3.14: PyQt6 and
        # cryptography ship abi3 wheels, and websockets 12.x — pinned below
        # 13 — has no cp313/cp314 wheel but does publish a py3-none-any
        # fallback, so it installs without its optional C speedups.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install virtual display for Qt (headless)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxcb-cursor0 libegl1 libgl1 libglib2.0-0

      - name: Run tests with coverage
        run: |
          # --cov-fail-under must stay in sync with fail_under in
          # pyproject.toml: this literal overrides it, so a mismatch
          # silently turns one of the two into fiction. 74 (not 87) because
          # coverage now measures gui/ and plugins/ too - see the comment on
          # fail_under in pyproject.toml.
          pytest -q \
            --durations=20 \
            --cov=equinox \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=74
        env:
          QT_QPA_PLATFORM: offscreen
          DISPLAY: ""

      - name: Upload coverage to Codecov
        if: matrix.python-version == env.PYTHON_DEFAULT
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Job: security (inline, blocking)
  # Run bandit at medium+ severity here in addition to the dedicated
  # security.yml workflow, so every PR gets a fast security gate.
  # ──────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan (bandit + dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Dependency vulnerabilities - blocking
        run: python scripts/check_dependency_vulnerabilities.py

      - name: Bandit - blocking (medium+ severity)
        # Skip list matches .pre-commit-config.yaml's bandit hooks: B102/B113/B318
        # are accepted findings in this codebase (sandboxed exec, an internal
        # vault client, and response pretty-printing), B608 has inline nosec
        # comments. CI never matched this until now, so those hooks and this
        # step disagreed on every push.
        run: bandit -r src/equinox --severity-level=medium -s "B102,B113,B318,B608" -f json -o bandit-ci.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-ci-report
          path: bandit-ci.json
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Final gate — all required jobs must pass
  # ──────────────────────────────────────────────────────────────────────────
  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || \
                "${{ needs.typecheck.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" || \
                "${{ needs.security.result }}" != "success" ]]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
