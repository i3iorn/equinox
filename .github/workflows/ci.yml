name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with Black
        run: |
          black --version
          black --check .
      - name: Lint with Isort
        run: |
          isort --version
          isort --check .
      - name: Lint with Ruff
        run: |
          python -m pip install -q ruff
          ruff --version
          ruff check .
      - name: Type checks (Mypy)
        run: |
          mypy src/equinox || true
      - name: Security checks (Bandit)
        run: |
          python -m pip install -q bandit
          bandit -r src/equinox -l --format json -q -o bandit.json || true
      - name: Safety checks
        run: |
          python -m pip install -q safety
          safety check -i tests -r requirements-dev.txt || true
      - name: Run tests
        run: |
          pytest -q --durations=10 --cov=equinox --cov-report=xml --cov-report=html --cov-fail-under=80
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: coverage.xml
        if: ${{ always() }}
